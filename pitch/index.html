<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>音高心臟病</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#fffdf7;color:#3b2414;overflow:hidden}button{font:inherit;touch-action:manipulation}.page{display:none;width:100vw;height:100dvh}.page.on{display:flex}
#setup{align-items:center;justify-content:center;padding:18px;overflow:auto}.box{width:min(940px,96vw);padding:24px;background:#fff;border:2px solid #eadcc7;border-radius:28px}h1{text-align:center;margin:0;font-size:clamp(36px,6vw,60px)}.lead{text-align:center;color:#756657;margin:6px 0 18px}.notes{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.n{border:2px solid #ddd;background:#fff;border-radius:13px;padding:11px 3px;font-weight:800}.n.sel{background:#3b2414;color:#fff}.row{display:flex;align-items:center;gap:12px}.row input[type=range]{flex:1}.actions{display:flex;gap:10px;margin-top:18px}.go,.small{border:0;border-radius:17px;padding:14px 20px;font-weight:900}.go{background:#3b2414;color:white;flex:1}.small{background:#eee}
#game{position:relative;flex-direction:column;padding:8px 16px 12px}.top{height:30%;display:grid;grid-template-columns:1fr .58fr 1fr;gap:10px;align-items:center}.team{text-align:center}.badge{display:inline-block;color:#fff;border-radius:15px;padding:5px 28px;font-size:clamp(21px,3vw,34px);font-weight:950}.red{background:#ff4545}.blue{background:#1680e8}.dist{font-size:clamp(25px,4vw,42px);font-weight:950}.track{height:120px;position:relative;overflow:hidden}.track:after{content:"";position:absolute;left:0;right:0;bottom:5px;height:4px;background:#ddd3c2}.spriteWrap{position:absolute;bottom:8px;transition:left .48s cubic-bezier(.2,.9,.2,1);z-index:2}.spriteWrap img{width:100%;height:100%;object-fit:contain}.crocWrap{width:185px;height:110px}.kidWrap{width:120px;height:110px}.redTrack .crocWrap{left:0}.redTrack .kidWrap{left:70%}.blueTrack .kidWrap{left:8%}.blueTrack .crocWrap{left:67%}
.timerbox{text-align:center}.timer{font-size:clamp(38px,6vw,65px);font-weight:950}.pile{display:inline-block;background:#fff4e2;border:2px solid #dec7a4;border-radius:13px;padding:5px 18px;font-size:clamp(20px,3vw,29px);font-weight:950}
.play{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.08fr 1fr;gap:14px;align-items:center}.hit{justify-self:center;width:90%;aspect-ratio:1;border-radius:50%;border:9px solid white;outline:3px solid #333;color:#fff;font-size:clamp(31px,5vw,61px);font-weight:950;box-shadow:0 8px 0 #aaa}.redbtn{background:linear-gradient(#ff4545,#e91f26)}.bluebtn{background:linear-gradient(#2691ef,#0870d7)}.hit:active{transform:translateY(5px);box-shadow:0 3px 0 #aaa}.card{height:min(49vh,435px);border:4px solid #aaa;border-radius:27px;background:#fff;display:flex;align-items:center}.score{width:100%;height:94%}.feedback{text-align:center;height:30px;font-size:24px;font-weight:950}.tools{position:absolute;bottom:7px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}.tool{pointer-events:auto;border:0;border-radius:12px;padding:8px 11px;background:#eee;font-weight:800}
.crocWrap.bump{animation:bump .45s}@keyframes bump{50%{transform:scale(1.04)}}
#result{position:fixed;inset:0;z-index:20;background:#fff9ed;display:none;align-items:center;justify-content:center}.resultCard{width:min(920px,94vw);background:#fff;border:3px solid #eadcc7;border-radius:30px;padding:18px;text-align:center}.resultText{opacity:0}.resultCard.reveal .resultText{animation:fade .45s forwards}@keyframes fade{to{opacity:1}}.winner{font-size:clamp(38px,7vw,70px);font-weight:950}.finalScore{font-size:23px;margin:5px 0 10px}
.chaseScene{height:390px;position:relative;overflow:hidden;border-radius:22px;background:#fffdf7}.ground{position:absolute;left:0;right:0;bottom:50px;height:4px;background:#ddd3c2}.runnerAnim,.crocAnim{position:absolute;z-index:3}.runnerAnim{width:125px;height:120px}.crocAnim{width:215px;height:135px}.runnerAnim img,.crocAnim img{width:100%;height:100%;object-fit:contain}
.runLegL,.runLegR,.crocLegL,.crocLegR{position:absolute;background:#3b2414;border-radius:10px;transform-origin:50% 0;z-index:2}.runLegL,.runLegR{width:8px;height:31px;bottom:9px}.runLegL{left:47px}.runLegR{left:67px}.crocLegL,.crocLegR{width:13px;height:27px;bottom:14px;background:#68a84d}.crocLegL{left:68px}.crocLegR{left:135px}
.running .runLegL{animation:legA .18s infinite alternate}.running .runLegR{animation:legB .18s infinite alternate}.running .crocLegL{animation:legB .2s infinite alternate}.running .crocLegR{animation:legA .2s infinite alternate}@keyframes legA{from{transform:rotate(40deg)}to{transform:rotate(-40deg)}}@keyframes legB{from{transform:rotate(-40deg)}to{transform:rotate(40deg)}}
.dust{position:absolute;font-size:34px;opacity:0;z-index:1}.running .dust{animation:dust .45s infinite}@keyframes dust{0%{opacity:0;transform:scale(.4)}50%{opacity:.8}100%{opacity:0;transform:translateX(-25px) scale(1.3)}}
.redLose .runnerAnim{animation:redRun 4.1s linear forwards}.redLose .crocAnim{animation:redChase 4.1s linear forwards}.blueLose .runnerAnim{animation:blueRun 4.1s linear forwards}.blueLose .crocAnim{animation:blueChase 4.1s linear forwards}
@keyframes redRun{0%{left:58%;top:230px}20%{left:78%;top:75px}40%{left:42%;top:25px;transform:scaleX(-1)}60%{left:8%;top:120px;transform:scaleX(-1)}78%{left:48%;top:230px;transform:scaleX(1)}88%{left:55%;top:235px;transform:scaleX(1)}100%{left:55%;top:235px;opacity:0;transform:scale(.08)}}@keyframes redChase{0%{left:18%;top:220px}20%{left:58%;top:85px}40%{left:52%;top:35px;transform:scaleX(-1)}60%{left:3%;top:115px;transform:scaleX(-1)}78%{left:31%;top:220px;transform:scaleX(1)}88%{left:42%;top:225px;transform:scaleX(1)}100%{left:48%;top:225px;transform:scaleX(1) scale(1.28)}}
@keyframes blueRun{0%{right:58%;top:230px}20%{right:78%;top:75px}40%{right:42%;top:25px;transform:scaleX(1)}60%{right:8%;top:120px;transform:scaleX(1)}78%{right:48%;top:230px;transform:scaleX(-1)}88%{right:55%;top:235px;transform:scaleX(-1)}100%{right:55%;top:235px;opacity:0;transform:scaleX(-1) scale(.08)}}@keyframes blueChase{0%{right:18%;top:220px}20%{right:58%;top:85px}40%{right:52%;top:35px;transform:scaleX(1)}60%{right:3%;top:115px;transform:scaleX(1)}78%{right:31%;top:220px;transform:scaleX(-1)}88%{right:42%;top:225px;transform:scaleX(-1)}100%{right:48%;top:225px;transform:scaleX(-1) scale(1.28)}}
.mouth{position:absolute;width:82px;height:10px;border-radius:50%;background:#fff3c2;opacity:0;z-index:5}.redLose .mouth{left:57%;top:282px;animation:mouthOpen 4.1s forwards}.blueLose .mouth{right:57%;top:282px;animation:mouthOpen 4.1s forwards}@keyframes mouthOpen{0%,76%{opacity:0;transform:scaleY(.1)}82%{opacity:1;transform:scaleY(2.8)}88%{opacity:1;transform:scaleY(4)}94%,100%{opacity:0;transform:scaleY(.1)}}.chompText{position:absolute;font-size:45px;font-weight:950;opacity:0;z-index:7;left:50%;top:190px;transform:translateX(-50%)}.running .chompText{animation:chompText 4.1s forwards}@keyframes chompText{0%,86%{opacity:0;transform:translateX(-50%) scale(.3)}90%{opacity:1;transform:translateX(-50%) scale(1.35)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
@media(max-width:700px){.notes{grid-template-columns:repeat(4,1fr)}.track{height:88px}.crocWrap{width:135px;height:82px}.kidWrap{width:85px;height:82px}.play{gap:7px}.card{height:41vh}.chaseScene{height:300px}}

/* 音高選擇：注音直向 */
#notes .n{min-height:92px;display:flex;align-items:center;justify-content:center;padding:8px 4px}
#notes .noteLabel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#notes .notePrefix{font-size:.72em;white-space:nowrap}
#notes .noteZhuyin{display:block;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:2px;font-size:1.08em;line-height:1}

/* ===== 結尾逐格追逐動畫 ===== */
.chaseScene{
  height:350px!important;
  background:#fffdf7!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  overflow:hidden!important;
}
.chaseScene .ground,.chaseScene .runnerAnim,.chaseScene .crocAnim,
.chaseScene .dust,.chaseScene .mouth,.chaseScene .chompText{display:none!important}
.frameChase{
  width:min(760px,96%);
  height:305px;
  object-fit:contain;
  border-radius:18px;
  background:#fffdf7;
  animation:frameBounce .18s ease-in-out infinite alternate;
}
@keyframes frameBounce{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@media(max-width:700px){.chaseScene{height:260px!important}.frameChase{height:220px}}

function update(t){
  $("#"+(t==="red"?"rd":"bd")).textContent=dist[t]+" m";
  const g=$("#"+(t==="red"?"rg":"bg"));
  const d=Math.max(0,Math.min(20,dist[t]));

  // 視覺安全距離：只要還有 1m 以上，鱷魚和小孩就絕不接觸。
  // 使用非線性逼近：前段明顯移動，最後幾公尺仍保留清楚空隙。
  const p=(20-Math.max(1,d))/19;
  const eased=1-Math.pow(1-p,1.45);

  if(t==="red"){
    // 紅隊：鱷魚由左往右追。1m 時最多到 37%，避免寬圖碰到 70% 的小孩。
    const start=0, near=37;
    g.style.left=(start+(near-start)*eased)+"%";
  }else{
    // 藍隊：鱷魚由右往左追。1m 時最多到 39%，避免寬圖碰到 8% 的小孩。
    const start=67, near=39;
    g.style.left=(start+(near-start)*eased)+"%";
  }

  g.classList.remove("bump");
  void g.offsetWidth;
  g.classList.add("bump");
}

function start(){if(selected.size<2){alert("請至少選擇兩個音高");return}$("#setup").classList.remove("on");$("#game").classList.add("on");$("#result").style.display="none";dist={red:20,blue:20};pile=0;idx=0;time=60;running=true;$("#rg").style.left="0";$("#bg").style.left="67%";$("#rd").textContent=$("#bd").textContent="20 m";$("#timer").textContent=60;deal();dealI=setInterval(deal,60000/+$("#speed").value);clockI=setInterval(()=>{time--;$("#timer").textContent=Math.max(0,time);if(time<=0)finish()},1000)}
