<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>直笛聲控闖關 B・A・G</title>
<style>
:root{--bg:#fffaf2;--card:#fff;--text:#292929;--muted:#777;--good:#168a4a;--bad:#cf3f3f;--accent:#4f7cff;--line:#e7dfd5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text)}
.wrap{max-width:900px;margin:auto;padding:16px}
h1{font-size:clamp(26px,5vw,42px);margin:6px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 8px 24px rgba(0,0,0,.04)}
.center{text-align:center}
.target{font-size:clamp(88px,22vw,170px);font-weight:900;line-height:1;margin:10px 0}
.sol{font-size:30px;font-weight:900;color:var(--accent)}
.status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
.box{background:#fafafa;border:1px solid #eee;border-radius:15px;padding:12px;text-align:center}
.label{font-size:14px;color:var(--muted)}
.val{font-size:26px;font-weight:900;margin-top:4px}
.meter{height:14px;background:#eee;border-radius:99px;overflow:hidden;margin-top:7px}
.bar{height:100%;width:0%;background:#888;transition:width .08s linear}
.track{position:relative;height:170px;border-radius:18px;overflow:hidden;background:linear-gradient(#cfedff 0 58%,#c9ebb7 58% 100%);border:2px solid var(--line)}
.road{position:absolute;left:0;right:0;bottom:25px;height:18px;background:#d7c19b}
.player{position:absolute;left:3%;bottom:40px;font-size:58px;transform:translateX(-50%);transition:left .4s ease}
.goal{position:absolute;right:2%;bottom:40px;font-size:55px}
.message{min-height:38px;text-align:center;font-size:22px;font-weight:900;margin-top:14px}
.good{color:var(--good)} .bad{color:var(--bad)}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:14px;padding:14px 18px;font-size:18px;font-weight:900;cursor:pointer}
#start{background:var(--accent);color:white}
#next{background:#eef2ff;color:#3156c8}
#reset{background:#f0f0f0;color:#444}
.note{font-size:14px;line-height:1.65;color:var(--muted);margin-top:14px}
@media(max-width:650px){.status{grid-template-columns:1fr}.track{height:150px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 直笛聲控闖關</h1>

  <div class="card center">
    <div class="label">請吹出這個音</div>
    <div id="target" class="target">B</div>
    <div id="sol" class="sol">Si</div>

    <div class="status">
      <div class="box">
        <div class="label">聽到的音</div>
        <div id="heard" class="val">—</div>
      </div>
      <div class="box">
        <div class="label">頻率</div>
        <div id="freq" class="val">— Hz</div>
      </div>
      <div class="box">
        <div class="label">麥克風音量</div>
        <div class="meter"><div id="bar" class="bar"></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="track">
      <div class="road"></div>
      <div id="player" class="player">🐰</div>
      <div class="goal">🏁</div>
    </div>

    <div id="msg" class="message">按「開始聽音」後吹奏</div>

    <div class="controls">
      <button id="start">🎤 開始聽音</button>
      <button id="next">🎲 換一題</button>
      <button id="reset">↺ 重新開始</button>
    </div>

    <div class="note">
      高音直笛判定：G5 ≈ 784 Hz、A5 ≈ 880 Hz、B5 ≈ 988 Hz。<br>
      若「麥克風音量」有跳動但音名沒有出現，請靠近 iPhone／iPad 一點吹；若音量完全不動，請檢查 Safari 的麥克風權限。
    </div>
  </div>
</div>

<script>
(() => {
  const NOTES={
    G:{freq:783.99,sol:"Sol"},
    A:{freq:880.00,sol:"La"},
    B:{freq:987.77,sol:"Si"}
  };
  const ORDER=["B","A","G"];
  const total=10;

  let current="B",step=0,stream=null,ctx=null,analyser=null,source=null,raf=null;
  let stableStart=0,cooldown=0;

  const $=id=>document.getElementById(id);
  const target=$("target"),sol=$("sol"),heard=$("heard"),freqEl=$("freq"),bar=$("bar");
  const player=$("player"),msg=$("msg"),start=$("start"),next=$("next"),reset=$("reset");

  function message(t,c=""){msg.textContent=t;msg.className="message "+c}
  function choose(){
    let n;
    do{n=ORDER[Math.floor(Math.random()*ORDER.length)]}while(n===current);
    current=n;target.textContent=n;sol.textContent=NOTES[n].sol;stableStart=0;
  }
  function updatePlayer(){ player.style.left=(3+(step/total)*84)+"%"; }
  function noteFromFreq(f){
    const midi=Math.round(69+12*Math.log2(f/440));
    const names=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
    return {name:names[(midi%12+12)%12],oct:Math.floor(midi/12)-1,midi};
  }
  function cents(f,ref){return 1200*Math.log2(f/ref)}

  function pitch(buf,sr){
    let rms=0;
    for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
    rms=Math.sqrt(rms/buf.length);
    if(rms<0.006) return {freq:-1,rms};

    const minLag=Math.floor(sr/1400);
    const maxLag=Math.min(Math.floor(sr/500),buf.length-2);
    let bestLag=-1,best=0;

    for(let lag=minLag;lag<=maxLag;lag++){
      let sum=0,a2=0,b2=0;
      for(let i=0;i<buf.length-lag;i++){
        const a=buf[i],b=buf[i+lag];
        sum+=a*b;a2+=a*a;b2+=b*b;
      }
      const corr=sum/Math.sqrt((a2*b2)||1);
      if(corr>best){best=corr;bestLag=lag}
    }
    if(bestLag<0 || best<0.55) return {freq:-1,rms};
    return {freq:sr/bestLag,rms};
  }

  async function begin(){
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}
      });
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==="suspended") await ctx.resume();
      analyser=ctx.createAnalyser();
      analyser.fftSize=4096;
      source=ctx.createMediaStreamSource(stream);
      source.connect(analyser);
      start.textContent="⏹ 停止聽音";
      message("正在聽…請吹「"+current+"」");
      loop();
    }catch(e){
      console.error(e);
      message("麥克風沒有成功啟動，請檢查 Safari 權限。","bad");
    }
  }

  function stopMic(){
    if(raf) cancelAnimationFrame(raf);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(source) try{source.disconnect()}catch(e){}
    if(ctx) ctx.close();
    stream=ctx=analyser=source=raf=null;
    start.textContent="🎤 開始聽音";
    heard.textContent="—";freqEl.textContent="— Hz";bar.style.width="0%";
    message("已停止聽音");
  }

  function success(){
    step++;
    updatePlayer();
    message("答對！🐰 前進一步！","good");
    cooldown=performance.now()+900;
    if(step>=total){
      setTimeout(()=>message("🎉 抵達終點！過關！","good"),250);
    }else{
      setTimeout(()=>{choose();message("下一題：請吹「"+current+"」")},650);
    }
  }

  function loop(){
    const data=new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(data);
    const r=pitch(data,ctx.sampleRate);
    const level=Math.min(100,r.rms*700);
    bar.style.width=level+"%";

    const now=performance.now();
    if(r.freq>0){
      freqEl.textContent=r.freq.toFixed(1)+" Hz";
      const n=noteFromFreq(r.freq);
      heard.textContent=n.name+n.oct;

      const ok=Math.abs(cents(r.freq,NOTES[current].freq))<=55;
      if(now<cooldown){
        stableStart=0;
      }else if(ok){
        if(!stableStart) stableStart=now;
        if(now-stableStart>300){
          stableStart=0;
          success();
        }else{
          message("抓到了！再穩一點…","good");
        }
      }else{
        stableStart=0;
        message("現在聽到「"+n.name+n.oct+"」，目標是 "+current+"5","bad");
      }
    }else{
      freqEl.textContent="— Hz";
      heard.textContent="—";
      stableStart=0;
      if(level>1) message("有收到聲音，正在判斷音高…");
    }
    raf=requestAnimationFrame(loop);
  }

  start.onclick=()=>stream?stopMic():begin();
  next.onclick=()=>{choose();message("換題完成，請吹「"+current+"」")};
  reset.onclick=()=>{step=0;updatePlayer();choose();message("重新開始！")};
  updatePlayer();
})();
</script>
</body>
</html>
