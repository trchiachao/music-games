<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>直笛聲控闖關</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;
  background:linear-gradient(#bfeeff 0 67%,#b8e986 67%);
  color:#402b1d;
  min-height:100vh;
}
.game{max-width:1050px;margin:auto;padding:14px}
.header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.title{
  font-size:clamp(26px,5vw,44px);
  font-weight:950;
  color:#13518c;
  text-shadow:0 2px #fff;
}
.counter{
  margin-left:auto;
  background:#fff1ad;
  border:4px solid white;
  border-radius:30px;
  padding:10px 18px;
  font-size:clamp(18px,3vw,27px);
  font-weight:900;
}
.track{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:6px;
  margin:28px 0 18px;
}
.cell{
  min-width:0;
  height:68px;
  border:4px solid #805326;
  background:#fff8e9;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:900;
  position:relative;
}
.cell.done{background:#ffe54e}
.bear{
  font-size:44px;
  position:absolute;
  top:-39px;
  left:50%;
  transform:translateX(-50%);
}
.panel{
  background:#fffefa;
  border:6px solid #55b8ef;
  border-radius:32px;
  padding:18px;
  text-align:center;
}
.prompt{
  display:inline-block;
  background:#178bdd;
  color:white;
  border-radius:30px;
  padding:9px 30px;
  font-size:clamp(22px,4vw,34px);
  font-weight:900;
}
.musicnote{
  font-size:82px;
  line-height:1;
  margin:14px 0 4px;
  color:#23160f;
}
.question-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:225px;
}
.question{
  width:min(250px,65vw);
  min-height:210px;
  border-radius:30px;
  border:6px solid #f14f78;
  background:#ffdce4;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:66px;
  font-weight:950;
  writing-mode:vertical-rl;
  text-orientation:upright;
  letter-spacing:8px;
}
.message{
  min-height:34px;
  margin-top:8px;
  font-size:21px;
  font-weight:900;
}
.good{color:#15924d}.bad{color:#c94141}
.status{
  margin-top:14px;
  background:white;
  border:4px solid #72c9ee;
  border-radius:24px;
  padding:12px;
  display:grid;
  grid-template-columns:auto 1fr auto auto;
  gap:12px;
  align-items:center;
  font-size:18px;
  font-weight:850;
}
.meter{
  height:22px;
  background:#e5e8e8;
  border-radius:999px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0;
  background:#20c46b;
  transition:width .08s linear;
}
.heard{
  min-width:90px;
  background:#fff8e9;
  border-radius:12px;
  padding:8px 12px;
  text-align:center;
}
.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}
button{
  border:0;
  border-radius:15px;
  padding:13px 20px;
  min-height:48px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}
.start{background:#187fd0;color:white}
.reset{background:white;color:#555}
@media(max-width:650px){
  .counter{margin-left:0}
  .track{gap:3px;margin-top:25px}
  .cell{height:50px;font-size:15px;border-width:3px;border-radius:10px}
  .bear{font-size:31px;top:-29px}
  .panel{padding:12px;border-width:4px}
  .musicnote{font-size:65px}
  .question-wrap{min-height:185px}
  .question{width:170px;min-height:175px;font-size:51px;border-width:4px}
  .status{grid-template-columns:auto 1fr;font-size:16px}
  .heard{grid-column:2}
}
</style>
</head>
<body>
<div class="game">
  <div class="header">
    <div class="title">🎵 直笛聲控闖關</div>
    <div id="counter" class="counter">第 1 / 10 題</div>
  </div>

  <div id="track" class="track"></div>

  <div class="panel">
    <div class="prompt">請吹出這個音</div>
    <div class="musicnote">♩</div>

    <div class="question-wrap">
      <div id="question" class="question">ㄙㄛ</div>
    </div>

    <div id="message" class="message">按「開始聽音」後吹奏</div>
  </div>

  <div class="status">
    <div>🎤 麥克風音量</div>
    <div class="meter"><div id="bar" class="bar"></div></div>
    <div>聽到的音：</div>
    <div id="heard" class="heard">---</div>
  </div>

  <div class="controls">
    <button id="start" class="start" type="button">🎤 開始聽音</button>
    <button id="reset" class="reset" type="button">↺ 重新開始</button>
  </div>
</div>

<script>
(() => {
  const NOTES = [
    { label: "ㄙㄛ", freq: 783.99 }, // G5
    { label: "ㄌㄚ", freq: 880.00 }, // A5
    { label: "ㄒㄧ", freq: 987.77 }  // B5
  ];

  const total = 10;
  let questionIndex = 0;
  let current = null;
  let previousLabel = null;

  let stream = null;
  let audioContext = null;
  let analyser = null;
  let source = null;
  let animationFrame = null;
  let stableSince = 0;
  let cooldownUntil = 0;

  const track = document.getElementById("track");
  const counter = document.getElementById("counter");
  const question = document.getElementById("question");
  const message = document.getElementById("message");
  const bar = document.getElementById("bar");
  const heard = document.getElementById("heard");
  const startButton = document.getElementById("start");
  const resetButton = document.getElementById("reset");

  function renderTrack() {
    track.innerHTML = "";
    for (let i = 0; i < total; i++) {
      const cell = document.createElement("div");
      cell.className = "cell" + (i < questionIndex ? " done" : "");
      cell.textContent = i + 1;

      if (i === Math.min(questionIndex, total - 1)) {
        const bear = document.createElement("span");
        bear.className = "bear";
        bear.textContent = "🐻";
        cell.appendChild(bear);
      }
      track.appendChild(cell);
    }
    counter.textContent = `第 ${Math.min(questionIndex + 1, total)} / ${total} 題`;
  }

  function chooseQuestion() {
    let next;
    do {
      next = NOTES[Math.floor(Math.random() * NOTES.length)];
    } while (NOTES.length > 1 && next.label === previousLabel);

    current = next;
    previousLabel = next.label;
    question.textContent = current.label;
    stableSince = 0;
    message.textContent = `請吹「${current.label}」`;
    message.className = "message";
  }

  function centsDifference(freq, reference) {
    return 1200 * Math.log2(freq / reference);
  }

  function closestNote(freq) {
    let best = NOTES[0];
    for (const n of NOTES) {
      if (Math.abs(centsDifference(freq, n.freq)) <
          Math.abs(centsDifference(freq, best.freq))) {
        best = n;
      }
    }
    return best;
  }

  function detectPitch(buffer, sampleRate) {
    let rms = 0;
    for (const value of buffer) rms += value * value;
    rms = Math.sqrt(rms / buffer.length);

    if (rms < 0.006) return { freq: -1, rms };

    const minLag = Math.floor(sampleRate / 1400);
    const maxLag = Math.min(Math.floor(sampleRate / 500), buffer.length - 2);

    let bestLag = -1;
    let bestCorrelation = 0;

    for (let lag = minLag; lag <= maxLag; lag++) {
      let sum = 0, a2 = 0, b2 = 0;

      for (let i = 0; i < buffer.length - lag; i++) {
        const a = buffer[i];
        const b = buffer[i + lag];
        sum += a * b;
        a2 += a * a;
        b2 += b * b;
      }

      const correlation = sum / Math.sqrt((a2 * b2) || 1);
      if (correlation > bestCorrelation) {
        bestCorrelation = correlation;
        bestLag = lag;
      }
    }

    if (bestLag <= 0 || bestCorrelation < 0.55) {
      return { freq: -1, rms };
    }

    return { freq: sampleRate / bestLag, rms };
  }

  async function startListening() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      analyser = audioContext.createAnalyser();
      analyser.fftSize = 4096;

      source = audioContext.createMediaStreamSource(stream);
      source.connect(analyser);

      startButton.textContent = "⏹ 停止聽音";
      message.textContent = `正在聽…請吹「${current.label}」`;
      listenLoop();
    } catch (error) {
      message.textContent = "無法啟動麥克風，請檢查 Safari 的麥克風權限";
      message.className = "message bad";
    }
  }

  function stopListening() {
    if (animationFrame) cancelAnimationFrame(animationFrame);
    if (stream) stream.getTracks().forEach(track => track.stop());
    if (source) {
      try { source.disconnect(); } catch (e) {}
    }
    if (audioContext) audioContext.close();

    stream = null;
    audioContext = null;
    analyser = null;
    source = null;
    animationFrame = null;

    startButton.textContent = "🎤 開始聽音";
    bar.style.width = "0%";
    heard.textContent = "---";
  }

  function success() {
    questionIndex++;
    renderTrack();

    message.textContent = "答對！小熊前進一格！";
    message.className = "message good";
    cooldownUntil = performance.now() + 900;

    if (questionIndex >= total) {
      counter.textContent = "10 / 10 完成！";
      message.textContent = "🎉 十題完成！過關！";
      stopListening();
      return;
    }

    setTimeout(chooseQuestion, 650);
  }

  function listenLoop() {
    const data = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(data);

    const result = detectPitch(data, audioContext.sampleRate);
    const volume = Math.min(100, result.rms * 700);
    bar.style.width = volume + "%";

    const now = performance.now();

    if (result.freq > 0) {
      const note = closestNote(result.freq);
      heard.textContent = note.label;

      const correct =
        Math.abs(centsDifference(result.freq, current.freq)) <= 55;

      if (now < cooldownUntil) {
        stableSince = 0;
      } else if (correct) {
        if (!stableSince) stableSince = now;

        if (now - stableSince >= 300) {
          stableSince = 0;
          success();
        } else {
          message.textContent = "抓到了，再穩一點…";
          message.className = "message good";
        }
      } else {
        stableSince = 0;
        message.textContent = `聽到「${note.label}」，再試一次`;
        message.className = "message bad";
      }
    } else {
      heard.textContent = "---";
      stableSince = 0;
    }

    animationFrame = requestAnimationFrame(listenLoop);
  }

  startButton.addEventListener("click", () => {
    if (stream) stopListening();
    else startListening();
  });

  resetButton.addEventListener("click", () => {
    questionIndex = 0;
    previousLabel = null;
    cooldownUntil = 0;
    renderTrack();
    chooseQuestion();
    message.textContent = "重新開始！";
    message.className = "message";
  });

  renderTrack();
  chooseQuestion();
})();
</script>
</body>
</html>
