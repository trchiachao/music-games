<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;color:#12386b;background:linear-gradient(#eaf7ff,#f8fcff);min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:24px 18px}.top{text-align:center}.top h1{font-size:clamp(38px,6vw,66px);margin:0;color:#12336b}.top p{font-size:20px;font-weight:800}.panel{background:#fff;border:2px solid #c9e6fb;border-radius:28px;padding:22px;margin:18px 0;box-shadow:0 8px 20px #aacde333}.label{display:inline-block;background:#16396d;color:#fff;border-radius:999px;padding:10px 20px;font-size:22px;font-weight:900;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.card{position:relative;border:3px solid transparent;border-radius:22px;padding:12px 7px;text-align:center;cursor:pointer;min-height:215px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}.card input{position:absolute;opacity:0}.card.sel{border-color:#168eea}.check{position:absolute;left:8px;top:8px;background:#168eea;color:#fff;border-radius:7px;width:30px;height:30px;display:grid;place-items:center;font-size:22px}.card:not(.sel) .check{background:#d4dde6;color:transparent}.pink{background:#fff0f4}.blue{background:#edf7ff}.yellow{background:#fff8dd}.green{background:#eafaf3}.purple{background:#f4edff}.cyan{background:#e9fbff}.name{font-size:22px;font-weight:900}.desc{font-weight:800;line-height:1.35}.sym{height:92px;display:flex;align-items:center;justify-content:center;width:100%}.sym svg{height:88px;max-width:125px;fill:#111}.rest{height:78px;width:auto}.start{display:block;margin:22px auto 0;border:0;border-radius:999px;padding:16px 54px;background:#13b969;color:#fff;font-size:30px;font-weight:900;cursor:pointer}.quiz,.result{display:none}.show{display:block}.hide{display:none}.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.qnum{background:#1788ea;color:#fff;border-radius:999px;padding:10px 22px;font-size:22px;font-weight:900}.score{font-size:20px;font-weight:900}.prompt{text-align:center;font-size:25px;font-weight:900;margin:14px}.rhythm{background:#fff;border:2px solid #d7e7f5;border-radius:25px;padding:20px;display:flex;align-items:center;justify-content:center;gap:15px;min-height:190px}.timesig{font-size:60px;line-height:.72;font-weight:700;color:#111}.beats{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:nowrap}.beat{width:115px;height:135px;display:flex;align-items:center;justify-content:center}.beat svg{width:100%;height:125px;fill:#111}.beat .rest{height:92px}.judge,.actions{display:flex;justify-content:center;gap:24px;margin-top:20px;flex-wrap:wrap}.judge button,.actions button{border:0;border-radius:999px;padding:15px 42px;font-size:25px;font-weight:900;cursor:pointer}.yes{background:#11b96b;color:#fff}.no{background:#f45464;color:#fff}.result{text-align:center}.result h2{font-size:42px}.big{font-size:64px;font-weight:900}.result p{font-size:22px;font-weight:800}.again{background:#168eea;color:#fff}.back{background:#e8eef4;color:#17385f}.msg{text-align:center;color:#c03b49;font-weight:800;min-height:24px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.beat{width:68px;height:100px}.beat svg{height:92px}.beat .rest{height:68px}.timesig{font-size:46px}.rhythm{padding:10px;gap:5px}}
</style></head><body><div class="wrap"><header class="top"><h1>節奏挑戰</h1><p>選擇要練習的節奏型態，開始遊戲吧！</p></header>
<section class="panel" id="setup"><div class="label">1　選擇節奏型態　<small>（可複選，至少選一個）</small></div><div class="grid" id="cards"></div><div class="msg" id="msg"></div><button class="start" id="start">▶ 開始遊戲</button></section>
<section class="panel quiz" id="quiz"><div class="status"><div class="qnum" id="qnum"></div><div class="score" id="score"></div></div><div class="prompt">請唸出下面的節奏</div><div class="rhythm"><div class="timesig">4<br>4</div><div class="beats" id="beats"></div></div><div class="judge"><button class="yes" id="yes">○ 答對</button><button class="no" id="no">× 答錯</button></div></section>
<section class="panel result" id="result"><h2>挑戰完成！</h2><div class="big" id="finalScore"></div><p id="finalText"></p><div class="actions"><button class="again" id="again">再挑戰 5 題</button><button class="back" id="back">重新選擇節奏型態</button></div></section></div>

const types=[["ta","ta",1,"pink","四分音符<br>1 拍"],["titi","ti - ti",1,"blue","兩個八分音符<br>1 拍"],["titiri","ti - tiri",1,"yellow","一個八分＋兩個十六分<br>1 拍"],["tiriti","tiri - ti",1,"green","兩個十六分＋一個八分<br>1 拍"],["tiritiri","tiri - tiri",1,"purple","四個十六分音符<br>1 拍"],["rest","噓",1,"pink","四分休止符<br>1 拍"],["taa","ta - a",2,"cyan","二分音符<br>2 拍"]];
function svg(k){if(k==="ta")return `<svg viewBox="0 0 100 140"><ellipse cx="38" cy="105" rx="17" ry="12"/><rect x="53" y="30" width="6" height="75"/></svg>`;
if(k==="titi")return `<svg viewBox="0 0 120 140"><ellipse cx="25" cy="105" rx="15" ry="11"/><ellipse cx="86" cy="105" rx="15" ry="11"/><rect x="38" y="32" width="6" height="73"/><rect x="99" y="32" width="6" height="73"/><rect x="38" y="32" width="67" height="9"/></svg>`;
if(k==="titiri")return `<svg viewBox="0 0 140 140"><ellipse cx="20" cy="105" rx="14" ry="10"/><ellipse cx="82" cy="105" rx="14" ry="10"/><ellipse cx="118" cy="105" rx="14" ry="10"/><rect x="31" y="30" width="6" height="75"/><rect x="93" y="30" width="6" height="75"/><rect x="129" y="30" width="6" height="75"/><rect x="31" y="30" width="104" height="8"/><rect x="93" y="45" width="42" height="8"/></svg>`;
if(k==="tiriti")return `<svg viewBox="0 0 140 140"><ellipse cx="22" cy="105" rx="14" ry="10"/><ellipse cx="58" cy="105" rx="14" ry="10"/><ellipse cx="120" cy="105" rx="14" ry="10"/><rect x="33" y="30" width="6" height="75"/><rect x="69" y="30" width="6" height="75"/><rect x="131" y="30" width="6" height="75"/><rect x="33" y="30" width="104" height="8"/><rect x="33" y="45" width="42" height="8"/></svg>`;
if(k==="tiritiri")return `<svg viewBox="0 0 150 140"><ellipse cx="18" cy="105" rx="13" ry="10"/><ellipse cx="55" cy="105" rx="13" ry="10"/><ellipse cx="92" cy="105" rx="13" ry="10"/><ellipse cx="129" cy="105" rx="13" ry="10"/><rect x="29" y="28" width="6" height="77"/><rect x="66" y="28" width="6" height="77"/><rect x="103" y="28" width="6" height="77"/><rect x="140" y="28" width="6" height="77"/><rect x="29" y="28" width="117" height="8"/><rect x="29" y="43" width="117" height="8"/></svg>`;
if(k==="rest")return `<img class="rest" src="${REST}" alt="四分休止符">`;
return `<svg viewBox="0 0 100 140"><ellipse cx="38" cy="105" rx="17" ry="12" fill="white" stroke="#111" stroke-width="6"/><rect x="53" y="30" width="6" height="75"/></svg>`}
const cards=document.getElementById("cards");types.forEach(t=>{const d=document.createElement("label");d.className=`card ${t[3]} sel`;d.dataset.id=t[0];d.innerHTML=`<input type="checkbox" checked><span class="check">✓</span><div class="name">${t[1]}</div><div class="sym">${svg(t[0])}</div><div class="desc">${t[4]}</div>`;const i=d.querySelector("input");i.onchange=()=>d.classList.toggle("sel",i.checked);d.onclick=e=>{if(e.target!==i){e.preventDefault();i.checked=!i.checked;i.onchange()}};cards.appendChild(d)});
let selected=[],qs=[],q=0,correct=0;const beatOf=id=>types.find(t=>t[0]===id)[2];const pick=a=>a[Math.floor(Math.random()*a.length)];
function question(){let a=[],sum=0;while(sum<4){let fit=selected.filter(x=>beatOf(x)<=4-sum);if(!fit.length)return null;let x=pick(fit);a.push(x);sum+=beatOf(x)}return a}
function makeSet(){qs=[];while(qs.length<5){let x=question();if(x)qs.push(x)}}
function show(){qnum.textContent=`第 ${q+1} / 5 題`;score.textContent=`目前答對：${correct} 題`;beats.innerHTML=qs[q].map(x=>`<div class="beat">${svg(x)}</div>`).join("")}
function run(){q=0;correct=0;makeSet();result.classList.remove("show");quiz.classList.add("show");show()}
start.onclick=()=>{selected=types.filter(t=>document.querySelector(`[data-id="${t[0]}"] input`).checked).map(t=>t[0]);if(!selected.length){msg.textContent="請至少選擇一種節奏型態";return}msg.textContent="";setup.classList.add("hide");run()}
function judge(ok){if(ok)correct++;q++;if(q<5)return show();quiz.classList.remove("show");result.classList.add("show");finalScore.textContent=`${correct} / 5`;finalText.textContent=correct>=4?"太棒了！":correct===3?"還不錯，繼續挑戰！":"再練習一次，你會越來越熟！"}
yes.onclick=()=>judge(true);no.onclick=()=>judge(false);again.onclick=run;back.onclick=()=>{result.classList.remove("show");setup.classList.remove("hide")}
</script></body></html>
