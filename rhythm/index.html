<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>節奏挑戰｜老師控制版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:#173f68;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}
h1{text-align:center;font-size:clamp(34px,5vw,54px);margin:10px}.sub{text-align:center;font-weight:700;color:#52708b}.panel{background:#fff;border:4px solid #b9ddf3;border-radius:26px;padding:25px;margin:20px 0}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.pick label{display:flex;align-items:center;justify-content:center;gap:10px;min-height:90px;border:3px solid #a9d4ef;border-radius:20px;font-size:24px;font-weight:900;cursor:pointer}.pick input{width:24px;height:24px}.symbol{font-size:38px}
button{border:0;border-radius:18px;padding:15px 25px;font-size:22px;font-weight:900;cursor:pointer}.start,.again{display:block;margin:auto;background:#1889d8;color:white}.warn{text-align:center;color:#d14b61;font-weight:800;min-height:25px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{background:#fff;border:3px solid #9eb4c7;border-radius:18px;padding:8px 15px;font-weight:900;font-size:20px}
.question{background:#fff;border:4px solid #b9ddf3;border-radius:28px;padding:30px 15px;margin:20px 0;text-align:center}.meter{font-size:34px;font-weight:900;margin-bottom:20px}
.rhythm{display:flex;justify-content:center;align-items:center;gap:clamp(16px,5vw,55px);min-height:180px}.beat{width:130px;min-width:0;height:150px;display:flex;align-items:center;justify-content:center}.rs{display:block;width:100%;height:140px;fill:#111}.rest-img{display:block;width:auto;height:105px;object-fit:contain}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:650px;margin:20px auto}.yes{background:#dff6e7;color:#147a40;border:3px solid #76cf96}.no{background:#ffe7ec;color:#b63250;border:3px solid #f29aaf}
.score{text-align:center;font-size:21px;font-weight:900}.result{text-align:center;background:#fff;border:4px solid #ffd977;border-radius:28px;padding:35px}.face{font-size:80px}.hidden{display:none}.home{color:#2778b5;text-decoration:none;font-weight:800}
@media(max-width:650px){.pick{grid-template-columns:1fr}.rhythm{gap:8px}.beat{width:25%}.rs{height:110px}.rest-img{height:90px}.judge{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<a class="home" href="../">← 回音樂遊戲首頁</a>
<section id="setup"><h1>🥁 節奏挑戰</h1><p class="sub">老師控制版｜選擇今天要練習的節奏型態</p><div class="panel">
<div class="pick">
<label><input type="checkbox" value="ta" checked><span class="symbol">♩</span> Ta</label>
<label><input type="checkbox" value="titi" checked><span class="symbol">♫</span> Ti-Ti</label>
<label><input type="checkbox" value="rest" checked><span class="symbol">𝄽</span> 四分休止符</label>
</div><div id="warn" class="warn"></div><button id="start" class="start">開始挑戰 ▶</button></div></section>

<section id="game" class="hidden"><div class="top"><div id="progress" class="badge">第 1 / 5 題</div><div class="badge">每題 20 分</div></div>
<div class="question"><div class="meter">4 / 4</div><div id="rhythm" class="rhythm"></div></div>
<div class="score">目前分數：<span id="score">0</span></div>
<div class="judge"><button id="yes" class="yes">⭕ 答對</button><button id="no" class="no">❌ 答錯</button></div></section>

<section id="result" class="result hidden"><div id="face" class="face"></div><h2 id="title"></h2><p id="text"></p><button id="again" class="again">再玩一次</button></section>
</main><script>

}
function makeQuestion(){
 let arr=[];
 for(let i=0;i<4;i++){
  let k=selected[Math.floor(Math.random()*selected.length)];
  if(selected.length>1 && i===0 && k===last) k=selected[(selected.indexOf(k)+1)%selected.length];
  arr.push(k);
 }
 last=arr[3];
 $("rhythm").innerHTML=arr.map(k=>`<div class="beat">${rhythmSVG(k)}</div>`).join("");
 $("progress").textContent=`第 ${q} / 5 題`;
 $("score").textContent=correct*20;
 locked=false;
}
$("start").addEventListener("click",()=>{
 selected=[...document.querySelectorAll('.pick input:checked')].map(x=>x.value);
 if(!selected.length){$("warn").textContent="請至少選擇一種節奏型態喔！";return}
 $("warn").textContent="";q=1;correct=0;$("setup").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");makeQuestion();
});
function judge(ok){
 if(locked)return;locked=true;if(ok)correct++;
 if(q===5){setTimeout(finish,250)}else{q++;setTimeout(makeQuestion,250)}
}
$("yes").addEventListener("click",()=>judge(true));$("no").addEventListener("click",()=>judge(false));
function finish(){
 $("game").classList.add("hidden");$("result").classList.remove("hidden");
 const score=correct*20;
 if(correct>=4){$("face").textContent="🥳";$("title").textContent="太棒了！";$("text").textContent=`答對 ${correct} 題，得到 ${score} 分！一起歡呼！`}
 else if(correct===3){$("face").textContent="😊";$("title").textContent="還不錯喔！";$("text").textContent=`答對 3 題，得到 60 分，再挑戰一次一定更熟練！`}
 else{$("face").textContent="😢";$("title").textContent="要再加油喔！";$("text").textContent=`答對 ${correct} 題，得到 ${score} 分，再試一次吧！`}
}
$("again").addEventListener("click",()=>{$("result").classList.add("hidden");$("setup").classList.remove("hidden")});
</script></body></html>
