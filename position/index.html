<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音符位置挑戰</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;color:#173f68;background:linear-gradient(#eaf8ff,#fffdf4)}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.home{color:#2778b5;text-decoration:none;font-weight:800}h1{text-align:center;margin:5px;font-size:clamp(30px,5vw,50px)}.sub,.score,.msg{text-align:center;font-weight:800}.progress{font-size:21px;font-weight:900;background:#fff;border:3px solid #9ab0c4;border-radius:18px;padding:8px 16px}.card{background:#fff;border:4px solid #a9d9f3;border-radius:26px;padding:8px 16px;margin:12px 0}svg{display:block;width:100%;max-height:300px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}.zone{border-radius:24px;padding:16px}.line{background:#e8f7ff;border:3px solid #8bd0f4}.space{background:#fff0f4;border:3px solid #ffb5c8}.zone h2{font-size:36px;margin:0 0 12px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ans{min-height:58px;border-radius:16px;background:#fff;font-size:19px;font-weight:900;cursor:pointer}.line .ans{border:3px solid #8bcdf1;color:#174a78}.space .ans{border:3px solid #ffb2c5;color:#7b3651}.msg{min-height:38px;font-size:23px;margin:8px}.result{text-align:center;background:#fff;border:4px solid #ffd978;border-radius:28px;padding:30px;margin-top:18px}.face{font-size:70px}.again{border:0;border-radius:999px;padding:14px 28px;background:#1889d8;color:white;font-size:20px;font-weight:900}.hidden{display:none}@media(max-width:720px){.choices{grid-template-columns:1fr}.buttons{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><main class="wrap"><div class="top"><a class="home" href="../">← 回音樂遊戲首頁</a><div id="progress" class="progress">第 1 / 10 題</div></div><h1>🎼 音符位置挑戰</h1><div class="sub">看著五線譜，選出這個音符在哪一條線、哪一個間！</div><section id="game"><div class="score">目前分數：<span id="score">0</span></div><div class="card"><svg id="staff" viewBox="0 0 900 300"></svg></div><div class="choices"><div class="zone line"><h2>線</h2><div id="lineBtns" class="buttons"></div></div><div class="zone space"><h2>間</h2><div id="spaceBtns" class="buttons"></div></div></div><div id="msg" class="msg"></div></section><section id="result" class="result hidden"><div id="face" class="face"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again" class="again">再玩一次</button></section></main>
<script>
const P=[
["下二間",-3,"space"],["下一線",-2,"line"],["下一間",-1,"space"],
["第一線",0,"line"],["第一間",1,"space"],["第二線",2,"line"],["第二間",3,"space"],
["第三線",4,"line"],["第三間",5,"space"],["第四線",6,"line"],["第四間",7,"space"],
["第五線",8,"line"],["上一間",9,"space"],["上一線",10,"line"],["上二間",11,"space"]
].map(x=>({label:x[0],step:x[1],type:x[2]}));
const L=P.filter(x=>x.type==="line"),S=P.filter(x=>x.type==="space");let q=0,score=0,cur,last="",lock=false;
const $=id=>document.getElementById(id),staff=$("staff"),msg=$("msg");
function buttons(a,id){$(id).innerHTML="";a.forEach(p=>{let b=document.createElement("button");b.className="ans";b.textContent=p.label;b.onclick=()=>answer(p.label);$(id).appendChild(b)})}
function line(x1,x2,y){let e=document.createElementNS("http://www.w3.org/2000/svg","line");for(const[k,v]of Object.entries({x1,x2,y1:y,y2:y,stroke:"#111","stroke-width":3}))e.setAttribute(k,v);staff.appendChild(e)}
function draw(p){staff.innerHTML="";const firstY=220,gap=26,x=520;for(let i=0;i<5;i++)line(180,780,firstY-i*gap);let t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",205);t.setAttribute("y",226);t.setAttribute("font-size",150);t.textContent="𝄞";staff.appendChild(t);let y=firstY-p.step*(gap/2);
if(p.step<=-2)for(let n=-2;n>=p.step;n-=2)line(x-35,x+35,firstY-n*(gap/2));
if(p.step>=10)for(let n=10;n<=p.step;n+=2)line(x-35,x+35,firstY-n*(gap/2));
let h=document.createElementNS("http://www.w3.org/2000/svg","ellipse");h.setAttribute("cx",x);h.setAttribute("cy",y);h.setAttribute("rx",18);h.setAttribute("ry",13);h.setAttribute("fill","#111");h.setAttribute("transform",`rotate(-18 ${x} ${y})`);staff.appendChild(h);let st=document.createElementNS("http://www.w3.org/2000/svg","line");st.setAttribute("x1",x+16);st.setAttribute("x2",x+16);st.setAttribute("y1",y);st.setAttribute("y2",y-65);st.setAttribute("stroke","#111");st.setAttribute("stroke-width",5);staff.appendChild(st)}
function next(){lock=false;msg.textContent="";q++;$("progress").textContent=`第 ${q} / 10 題`;$("score").textContent=score;let pool=P.filter(x=>x.label!==last);cur=pool[Math.floor(Math.random()*pool.length)];last=cur.label;draw(cur)}
function answer(v){if(lock)return;lock=true;if(v===cur.label){score+=10;msg.textContent="答對了！🌟";msg.style.color="#16894c"}else{msg.textContent=`答案是：${cur.label}`;msg.style.color="#d34b61"}$("score").textContent=score;setTimeout(()=>q>=10?finish():next(),800)}
function finish(){$("game").classList.add("hidden");$("result").classList.remove("hidden");$("progress").textContent="完成！";let n=score/10;$("face").textContent=n>=8?"🥳":n>=5?"😊":"💪";$("resultTitle").textContent=n>=8?"太厲害了！":n>=5?"很不錯喔！":"再加油！";$("resultText").textContent=`答對 ${n} / 10 題，得到 ${score} 分！`}
$("again").onclick=()=>{q=0;score=0;last="";$("result").classList.add("hidden");$("game").classList.remove("hidden");next()};buttons(L,"lineBtns");buttons(S,"spaceBtns");next();
</script></body></html>
